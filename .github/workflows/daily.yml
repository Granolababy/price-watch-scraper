name: Daily price check

on:
  schedule:
    - cron: "0 9 * * *"        # every day at 09:00 UTC
  workflow_dispatch:           # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape and diff against the last run
        run: python scraper.py --pages 2 --out data/latest

      - name: Commit updated data
        run: |
          git config user.name "price-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) price snapshot"
          git push
